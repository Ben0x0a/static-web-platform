# dependabot.yml — weekly update proposals for the pinned CI actions and the
# npm dev tools (TypeScript, esbuild, @types/node). Each arrives as a pull
# request that runs CI.
# With the dev/main workflow (coding-rules), add `target-branch: dev` to each entry.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
