# ci.yml — checks of the platform itself on every push and pull request.
#
# Defines : type check (sources + tests) and unit tests (Node test runner for
#           the TypeScript core/services, unittest for the Python build tools).
# Uses    : mise.toml (Node.js), package-lock.json (TypeScript, esbuild, @types/node).
# End-to-end behaviour (build, gate in Chrome) is verified in the apps' CI.
# Actions pinned to commit SHAs (version in the comment); Dependabot updates them.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
