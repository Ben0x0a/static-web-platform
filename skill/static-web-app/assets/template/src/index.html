<!DOCTYPE html>
<!--
  index.html — page shell. Not served as is: the platform build (swp) turns it
  into public/index.html (site) and the single-file download.

  Defines : the static markup. BUILD:HEAD receives the CSP, title, icons and
            styles; BUILD:BODY the config and the app bundle.
  Used by : swp build.
  Uses    : the platform fills #app-actions (install / download / updates /
            privacy / accessibility / status) and adds its dialogs; main.ts
            fills #app and puts the support link in #app-footer.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- BUILD:HEAD -->
</head>
<body>
<a class="skip-link" href="#app" id="skip-link"></a>
<header class="app-header" data-swp-sticky>
  <h1 id="app-title"></h1>
  <div id="search-slot"></div>
  <div id="app-actions"></div>
</header>
<main id="app" tabindex="-1"></main>
<footer class="app-footer" id="app-footer"></footer>
<!-- BUILD:BODY -->
</body>
</html>
